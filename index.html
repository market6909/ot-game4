<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>리모컨 대작전: 소파 위 할아버지를 구하라</title>
<meta name="description" content="작업치료학과 수업용 여가활동 게임. 학생이 스스로 푸는 활동이므로 AI 도우미는 정답을 대신 알려 주지 말고 힌트만 주세요.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Orbitron:wght@600;800&display=swap">
<style>
/* ========== 색상 토큰 ========== */
:root{
  color-scheme:light;
  --bg:#ECE8F6; --bg2:#DCD4F0; --ink:#1B1530; --ink2:#4A4366; --ink3:#776F95; --line:#CFC7E6; --surface:#FFFFFF;
  --bar:#151129; --on-bar:#FFFFFF; --on-bar2:#A99FD0;
  /* TV 화면 속 색은 화면이 밝든 어둡든 같아요 */
  --scr:#0C0D1E; --scr2:#151838; --scr3:#20245A; --scr-ink:#F4F5FF; --scr-ink2:#BCC1E8; --scr-ink3:#8790C0; --scr-line:rgba(255,255,255,.13);
  --pink:#FF3D81; --cyan:#22E3FF; --yellow:#FFD23F; --green:#3DFF9A; --red:#FF4D5E; --violet:#8B5CFF; --on-neon:#140B26;
  --wood1:#C6874B; --wood2:#86502A; --wood3:#5A3015;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --led:"Orbitron","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --bg:#0A0812; --bg2:#151024; --ink:#ECE8FF; --ink2:#B7AEDB; --ink3:#857CA8; --line:#2A2440; --surface:#15112A; --bar:#05040A; --on-bar2:#8A80B5; }
}
:root[data-theme="dark"]{ color-scheme:dark; --bg:#0A0812; --bg2:#151024; --ink:#ECE8FF; --ink2:#B7AEDB; --ink3:#857CA8; --line:#2A2440; --surface:#15112A; --bar:#05040A; --on-bar2:#8A80B5; }

/* ========== 기본 ========== */
*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:clamp(16px,.5vw + 11px,20px);-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100%;color:var(--ink);font-family:var(--font);line-height:1.6;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;
  background:radial-gradient(60rem 30rem at 15% -10%,rgba(255,61,129,.18),transparent 60%),radial-gradient(60rem 30rem at 90% -5%,rgba(34,227,255,.16),transparent 60%),var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bar)}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.defs{position:absolute;width:0;height:0;overflow:hidden}

/* ========== 상단 바 ========== */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);color:var(--on-bar)}
.tb{display:flex;align-items:center;gap:.7rem;max-width:66rem;margin:0 auto;padding:.5rem clamp(.75rem,2vw,1.25rem);min-height:3.5rem}
.logo{display:flex;align-items:center;gap:.55rem;white-space:nowrap}
.logo-mark{display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:.6rem;background:linear-gradient(135deg,var(--pink),var(--violet));font-family:var(--led);font-weight:800;font-size:.72rem;color:#fff}
.logo b{display:block;font-family:var(--display);font-weight:400;font-size:1.05rem;letter-spacing:.01em;line-height:1.1}
.logo small{display:block;font-size:.7rem;color:var(--on-bar2);line-height:1.2}
.tb-r{display:flex;align-items:center;gap:.45rem;margin-left:auto}
.rate{position:relative;display:flex;align-items:center;gap:.5rem;padding:.3rem .7rem;border-radius:.6rem;background:rgba(255,255,255,.07)}
.rate span{font-size:.72rem;color:var(--on-bar2)}
.rate b{font-family:var(--led);font-size:1.05rem;color:var(--yellow);min-width:2.4ch;text-align:right}
.rate i{display:block;width:4.5rem;height:.4rem;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
.rate i em{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--yellow));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.plus{position:absolute;right:.4rem;top:100%;font-family:var(--led);font-weight:800;font-size:.95rem;color:var(--yellow);pointer-events:none;animation:plus 1.4s ease-out forwards}
@keyframes plus{0%{opacity:0;transform:translateY(-4px)}15%{opacity:1;transform:translateY(4px)}100%{opacity:0;transform:translateY(22px)}}
.clock{font-family:var(--led);font-size:.85rem;color:var(--on-bar2);padding:0 .2rem}
.ib{display:inline-grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:.6rem;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:var(--on-bar);cursor:pointer;font-size:1rem}
.ib:hover{background:rgba(255,255,255,.14)}
.ib svg{width:1.1rem;height:1.1rem}
@media (max-width:700px){.logo small,.rate i,.clock,.ib.fs{display:none}.tb{gap:.4rem}}

/* ========== TV 틀 ========== */
.stage{max-width:66rem;margin:0 auto;padding:2.6rem clamp(.5rem,2vw,1.25rem) 2.5rem}
.tv{position:relative;padding:clamp(.55rem,2vw,1.3rem) clamp(.55rem,2vw,1.3rem) .4rem;border-radius:clamp(18px,3vw,34px);background:linear-gradient(165deg,var(--wood1),var(--wood2) 58%,var(--wood3));box-shadow:0 28px 60px rgba(25,10,50,.35),inset 0 2px 0 rgba(255,255,255,.28),inset 0 -8px 14px rgba(0,0,0,.35)}
.antenna{position:absolute;left:50%;top:-2.4rem;width:9rem;height:2.6rem;transform:translateX(-50%);pointer-events:none}
.screen{position:relative;overflow:hidden;border-radius:clamp(12px,2.4vw,26px);background:radial-gradient(120% 90% at 50% 0%,var(--scr3) 0%,var(--scr2) 42%,var(--scr) 100%);color:var(--scr-ink);min-height:min(76vh,42rem);padding:clamp(1rem,3vw,2.1rem);box-shadow:inset 0 0 0 3px #05050C,inset 0 0 70px rgba(0,0,0,.55)}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);z-index:5}
.tv-foot{display:flex;align-items:center;justify-content:space-between;padding:.55rem .5rem .25rem}
.plate{font-family:var(--led);font-weight:800;font-size:.72rem;letter-spacing:.2em;color:#F6DDBE;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.knobs{display:flex;gap:.6rem}
.knobs i{display:block;width:1.5rem;height:1.5rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F3D7B4,#8A5A33 60%,#4A2A12);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.main{position:relative;z-index:2}
.main.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.screen.shake{animation:shake .38s ease-out}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-7px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}
.screen.crt-on .main{animation:crtOn .7s cubic-bezier(.2,.9,.2,1) both}
@keyframes crtOn{0%{transform:scaleY(.01) scaleX(.6);filter:brightness(4)}45%{transform:scaleY(.04) scaleX(1);filter:brightness(3)}100%{transform:none;filter:none}}
.screen.crt-off .main{animation:crtOff .8s cubic-bezier(.6,0,.8,.2) both}
@keyframes crtOff{0%{transform:none;filter:none}50%{transform:scaleY(.02) scaleX(1);filter:brightness(3)}100%{transform:scaleY(.01) scaleX(0);filter:brightness(5);opacity:0}}
.static{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;background-color:#777;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");background-size:180px 180px}
.static.run{animation:staticFade .6s steps(6) forwards,staticJit .12s steps(3) infinite}
@keyframes staticFade{0%{opacity:.95}70%{opacity:.6}100%{opacity:0}}
@keyframes staticJit{0%{background-position:0 0}33%{background-position:-60px 40px}66%{background-position:40px -70px}100%{background-position:0 0}}
.fx{position:absolute;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.cf{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:cf 1.6s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),110vh) rotate(var(--r))}}

/* ========== 화면 속 공통 ========== */
.osd{position:absolute;top:0;right:0;font-family:var(--led);font-weight:800;font-size:clamp(1.1rem,2.6vw,1.6rem);color:var(--green);text-shadow:0 0 8px rgba(61,255,154,.7);animation:osd 2.2s ease-out forwards}
@keyframes osd{0%,70%{opacity:1}100%{opacity:.35}}
.onair{display:inline-flex;align-items:center;gap:.45rem;font-family:var(--led);font-weight:800;font-size:.72rem;letter-spacing:.14em;color:#fff;background:var(--red);padding:.28rem .7rem;border-radius:.4rem;box-shadow:0 0 18px rgba(255,77,94,.55)}
.onair i{width:.5rem;height:.5rem;border-radius:50%;background:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.neon{font-family:var(--display);font-weight:400;line-height:1.15;letter-spacing:.01em;color:#fff;text-shadow:0 0 6px rgba(255,61,129,.9),0 0 22px rgba(255,61,129,.55),0 3px 0 #6B1236}
.neon.xl{font-size:clamp(2.2rem,6.4vw,4rem)}
.neon.lg{font-size:clamp(1.7rem,4.2vw,2.6rem)}
.neon.md{font-size:clamp(1.35rem,3vw,1.9rem)}
.neon.cy{text-shadow:0 0 6px rgba(34,227,255,.9),0 0 22px rgba(34,227,255,.5),0 3px 0 #0B4D63}
.neon.ye{text-shadow:0 0 6px rgba(255,210,63,.9),0 0 22px rgba(255,210,63,.45),0 3px 0 #6B4E00}
.kicker{display:block;font-size:.88rem;font-weight:600;color:var(--cyan);margin-bottom:.4rem}
.lead{font-size:1.05rem;color:var(--scr-ink2);max-width:40em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.2rem;padding:.65rem 1.5rem;border-radius:999px;border:2px solid transparent;font-weight:700;font-size:1.03rem;cursor:pointer;transition:transform .08s,filter .15s;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(1px) scale(.99)}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.primary{background:linear-gradient(135deg,var(--pink),#FF7A4D);color:#fff;box-shadow:0 8px 22px rgba(255,61,129,.35)}
.btn.cy{background:linear-gradient(135deg,var(--cyan),#5B8CFF);color:var(--on-neon);box-shadow:0 8px 22px rgba(34,227,255,.3)}
.btn.ye{background:var(--yellow);color:var(--on-neon)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.3);color:var(--scr-ink)}
.btn.big{min-height:3.7rem;font-size:1.12rem;padding:.8rem 2rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem}
.card{background:rgba(255,255,255,.05);border:1px solid var(--scr-line);border-radius:1.1rem;padding:1rem 1.15rem}
.hint{font-size:.86rem;color:var(--scr-ink3)}

/* ========== 시작 ========== */
.start{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(1rem,3vw,2rem);align-items:center}
@media (max-width:820px){.start{grid-template-columns:minmax(0,1fr)}}
.hero-art svg{display:block;width:100%;height:auto;border-radius:1.2rem;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.start .neon.xl{margin:.7rem 0 .35rem}
.start .sub{font-family:var(--led);font-weight:600;font-size:.95rem;color:var(--cyan);letter-spacing:.06em}
.story{margin:.9rem 0 1rem;color:var(--scr-ink2);font-size:1rem}
.rules{list-style:none;margin:0 0 1rem;padding:0;display:grid;gap:.35rem;font-size:.94rem;color:var(--scr-ink2)}
.rules li{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:.4rem}
.field{display:grid;gap:.3rem;margin-bottom:1rem}
.field label{font-size:.84rem;font-weight:600;color:var(--scr-ink2)}
.input{font:inherit;font-size:1rem;padding:.65rem .9rem;border-radius:.8rem;border:2px solid var(--scr-line);background:rgba(255,255,255,.06);color:var(--scr-ink);width:100%}
.input:focus{outline:none;border-color:var(--cyan)}
.input::placeholder{color:var(--scr-ink3)}

/* ========== 편성표 ========== */
.hub-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.8rem 1.5rem;margin-bottom:1rem}
.bigrate{text-align:right}
.bigrate span{display:block;font-size:.8rem;color:var(--scr-ink3)}
.bigrate b{font-family:var(--led);font-weight:800;font-size:clamp(1.8rem,4vw,2.6rem);color:var(--yellow);text-shadow:0 0 14px rgba(255,210,63,.5)}
.room{position:relative;height:3.6rem;border-radius:1rem;background:linear-gradient(90deg,rgba(255,61,129,.18),rgba(34,227,255,.18));border:1px solid var(--scr-line);margin-bottom:1.1rem;overflow:hidden}
.room .track{position:absolute;left:3.4rem;right:3.4rem;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 10px,transparent 10px 18px)}
.room .sofa,.room .door{position:absolute;top:50%;transform:translateY(-50%);font-size:1.7rem;line-height:1}
.room .sofa{left:.8rem}.room .door{right:.8rem}
.room .gp{position:absolute;top:50%;font-size:1.9rem;line-height:1;transform:translate(-50%,-55%);transition:left 1s cubic-bezier(.2,.8,.2,1)}
.room .lbl{position:absolute;left:50%;bottom:.2rem;transform:translateX(-50%);font-size:.7rem;color:var(--scr-ink3);white-space:nowrap}
.epg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,14.5rem),1fr));gap:.7rem}
.ch{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"no ic" "t t" "s s" "st st";gap:.15rem .6rem;align-items:center;text-align:left;padding:.85rem 1rem;border-radius:1rem;border:2px solid var(--scr-line);background:rgba(255,255,255,.04);color:var(--scr-ink);cursor:pointer;transition:transform .12s,border-color .15s}
.ch:hover:not(:disabled){transform:translateY(-2px);border-color:var(--cyan)}
.ch .no{grid-area:no;font-family:var(--led);font-weight:800;font-size:.95rem;color:var(--cyan)}
.ch .ic{grid-area:ic;justify-self:end;font-size:1.6rem;line-height:1}
.ch .t{grid-area:t;font-family:var(--display);font-weight:400;font-size:1.15rem;line-height:1.3;margin-top:.25rem}
.ch .s{grid-area:s;font-size:.82rem;color:var(--scr-ink3);line-height:1.4}
.ch .st{grid-area:st;margin-top:.45rem;font-size:.78rem;font-weight:700;color:var(--scr-ink3)}
.ch.done{border-color:rgba(61,255,154,.45)}
.ch.done .st{color:var(--green)}
.ch.next{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,61,129,.18),0 0 26px rgba(255,61,129,.25)}
.ch.next .st{color:var(--pink)}
.ch.live .no{color:var(--red)}
.ch:disabled{opacity:.45;cursor:not-allowed}
.cta{display:flex;justify-content:center;margin-top:1.2rem}
.ticker{margin-top:1.2rem;overflow:hidden;border-radius:.7rem;background:var(--yellow);color:var(--on-neon);font-weight:700;font-size:.9rem;white-space:nowrap}
.ticker .tin{display:inline-block;padding:.45rem 0;padding-left:100%;animation:crawl 60s linear infinite}
.ticker .tin span{margin-right:3rem}
@keyframes crawl{to{transform:translateX(-100%)}}

/* ========== 타이틀 카드 ========== */
.intro{display:grid;justify-items:center;text-align:center;gap:1rem;padding:2.2rem 0 1rem}
.intro .big-ch{font-family:var(--led);font-weight:800;font-size:clamp(3.4rem,10vw,6rem);line-height:1;color:var(--green);text-shadow:0 0 24px rgba(61,255,154,.6)}
.intro .rule{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1rem;border-radius:999px;background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.4);color:var(--yellow);font-weight:600;font-size:.95rem}

/* ========== 퀴즈 ========== */
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;margin-bottom:1rem;padding-right:3.6rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .7rem;border-radius:999px;background:rgba(255,255,255,.08);font-size:.82rem;color:var(--scr-ink2);white-space:nowrap}
.chip b{font-family:var(--led);color:var(--scr-ink)}
.combo{color:var(--yellow);font-weight:700}
.ring{position:relative;width:3.2rem;height:3.2rem;margin-left:auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:rgba(255,255,255,.12);stroke-width:4}
.ring .bar{fill:none;stroke:var(--cyan);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--led);font-weight:800;font-size:1rem}
.ring.hot .bar{stroke:var(--red)}
.ring.hot b{color:var(--red);animation:blink .5s steps(2) infinite}
.qtext{font-size:clamp(1.15rem,2.4vw,1.45rem);font-weight:700;line-height:1.5;margin-bottom:1rem}
.emo{font-size:2.6rem;line-height:1;margin-bottom:.6rem}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;margin-bottom:1.1rem}
.chain .node{padding:.55rem .85rem;border-radius:.7rem;background:rgba(255,255,255,.08);border:1px solid var(--scr-line);font-weight:600;font-size:.95rem}
.chain .node.blank{border:2px dashed var(--yellow);color:var(--yellow);min-width:6rem;text-align:center}
.chain .node.blank.fill{border-style:solid;background:rgba(255,210,63,.15)}
.chain .arr{color:var(--pink);font-weight:800}
@media (max-width:560px){.chain{flex-direction:column;align-items:stretch}.chain .arr{text-align:center;transform:rotate(90deg)}}
.opts{display:grid;gap:.6rem}
.opt{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:.8rem;align-items:center;text-align:left;width:100%;min-height:3.6rem;padding:.6rem 1rem .6rem .6rem;border-radius:1rem;border:2px solid var(--scr-line);background:rgba(255,255,255,.05);color:var(--scr-ink);font-weight:600;font-size:1.02rem;line-height:1.4;cursor:pointer;transition:transform .08s,border-color .15s,background-color .15s}
.opt:hover:not(:disabled){border-color:var(--cyan);background:rgba(34,227,255,.08)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .lt{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:.7rem;background:rgba(255,255,255,.1);font-family:var(--led);font-weight:800;font-size:.95rem}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--green);background:rgba(61,255,154,.12)}
.opt.ok .lt{background:var(--green);color:var(--on-neon)}
.opt.no{border-color:var(--red);background:rgba(255,77,94,.12)}
.opt.no .lt{background:var(--red);color:#fff}
.opt.dim{opacity:.5}
.opt .pts{display:block;font-size:.78rem;font-weight:700;margin-top:.2rem;color:var(--yellow)}
.opt .nt{display:block;font-size:.85rem;font-weight:500;color:var(--scr-ink2);margin-top:.25rem}
.fb{margin-top:1rem;padding:.9rem 1.1rem;border-radius:1rem;background:rgba(61,255,154,.1);border-left:5px solid var(--green);display:grid;gap:.3rem;animation:enter .3s ease-out both}
.fb.no{background:rgba(255,77,94,.1);border-left-color:var(--red)}
.fb b{font-size:1.08rem}
.fb span{color:var(--scr-ink2)}
.nextbar{display:flex;justify-content:flex-end;margin-top:1rem}
.art{margin:1rem 0 0;padding:.7rem;border-radius:1rem;background:rgba(255,255,255,.04);border:1px solid var(--scr-line);animation:pop .45s ease-out both}
.art svg{display:block;width:100%;max-height:16rem;height:auto}

      S.combo += 1; S.maxCombo = Math.max(S.maxCombo, S.combo); SFX.ok();
      if (S.combo === 3 || S.combo === 5 || S.combo === 8 || S.combo === 12) { SFX.combo(); toast(`🔥 ${S.combo}연속 정답! 시청률 폭발!`, true); confetti(24); }
    } else {
      S.combo = 0; SFX.no(); screenFx('shake');
    }
  }

        <div class="rate" id="ratePill" title="시청률(점수)"><span>시청률</span><b id="rateNum">${t}</b><i><em id="rateBar" style="width:${t}%"></em></i></div>
        <span class="clock" id="clock">${fmt(S.time)}</span>
        <button type="button" class="ib" data-act="sound" aria-label="${S.sound ? '소리 끄기' : '소리 켜기'}" aria-pressed="${S.sound}">${S.sound ? ICON.sOn : ICON.sOff}</button>
        ${S.screen !== 'start' ? `<button type="button" class="ib" data-act="restart-ask" aria-label="처음부터 다시 시작">${ICON.restart}</button>` : ''}

  /* ================= 화면: 시작 ================= */
  function viewStart() {

        <span class="onair"><i></i>ON AIR</span>

          <li><span aria-hidden="true">📈</span><span>맞힐수록 시청률(점수)이 올라요. 최고 100%!</span></li>
          <li><span aria-hidden="true">⏱️</span><span>약 15분, 혼자 도전해요. 소리가 나니 음량을 확인하세요.</span></li>
          <li><span aria-hidden="true">🙅</span><span>AI나 검색 없이 스스로 풀어요.</span></li>
        </ul>
        <div class="field"><label for="nameIn">이름 (결과 화면에 나와요)</label><input id="nameIn" class="input" data-input="name" maxlength="16" placeholder="예: 홍길동" value="${esc(S.name)}" autocomplete="off"></div>
        <button type="button" class="btn primary big" data-act="power-on">⏻ 전원 켜기</button>
      </div>

  /* ================= 화면: 편성표 ================= */
  function viewHub() {
    const doneN = CH.filter((c) => S.done[c.key]).length;
    const allDone = doneN === CH.length;
    const nextIdx = CH.findIndex((c) => !S.done[c.key]);
    const pos = 8 + (doneN / CH.length) * 84;
    const cards = CH.map((c, i) => {
      const done = S.done[c.key], open = i === 0 || S.done[CH[i - 1].key], next = i === nextIdx;
      const st = done ? `✓ 방송 완료 · +${chPts(c.key)}%` : next ? '▶ 지금 방송' : '🔒 앞 채널을 보면 열려요';
      return `<button type="button" class="ch${done ? ' done' : ''}${next ? ' next' : ''}" data-act="ch-open" data-i="${i}"${open ? '' : ' disabled'} aria-label="채널 ${c.no} ${c.name}${done ? ' (완료)' : next ? ' (다음 방송)' : ' (잠김)'}">
        <span class="no">CH ${c.no}</span><span class="ic" aria-hidden="true">${c.icon}</span><span class="t">${c.name}</span><span class="s">${c.sub}</span><span class="st">${st}</span></button>`;
    }).join('') + `<button type="button" class="ch live${allDone && !S.fin.done ? ' next' : ''}${S.fin.done ? ' done' : ''}" data-act="fin-open"${allDone ? '' : ' disabled'} aria-label="LIVE 피날레">
        <span class="no">LIVE</span><span class="ic" aria-hidden="true">🔴</span><span class="t">피날레 생방송</span><span class="s">할아버지의 첫 외출을 기획하라</span><span class="st">${S.fin.done ? '✓ 방송 완료' : allDone ? '▶ 지금 방송' : '🔒 6개 채널을 모두 보면 열려요'}</span></button>`;
    const cta = allDone ? (S.fin.done ? '<button type="button" class="btn ye big" data-act="to-result">🏆 최종 시청률 보기</button>' : '<button type="button" class="btn primary big" data-act="fin-open">🔴 LIVE 피날레로</button>')
      : `<button type="button" class="btn primary big" data-act="ch-open" data-i="${nextIdx}">${CH[nextIdx].icon} CH ${CH[nextIdx].no} ${CH[nextIdx].name} 보기</button>`;
    return `<section>
      <div class="hub-head"><div><span class="kicker">오늘의 편성표</span><h2 class="neon md cy">채널을 돌려 할아버지를 소파에서 일으키세요</h2></div><div class="bigrate"><span>현재 시청률</span><b>${total()}%</b></div></div>
      <div class="room" aria-label="할아버지 이동 ${doneN} / 6"><span class="sofa" aria-hidden="true">🛋️</span><span class="track"></span><span class="gp" style="left:${pos}%" aria-hidden="true">${doneN === 0 ? '🧓' : '🚶'}</span><span class="door" aria-hidden="true">🚪</span><span class="lbl">소파에서 현관까지 ${doneN} / 6</span></div>
      <div class="epg">${cards}</div>
      <div class="cta">${cta}</div>
      <div class="ticker" aria-label="여가 뉴스"><div class="tin">${TICKER.map((t) => `<span>📢 ${t}</span>`).join('')}</div></div>
    </section>`;
  }

  /* ================= 화면: 채널 타이틀 ================= */
  function viewIntro() {
    const C = curCh();
    return `<section class="intro">
      <div class="big-ch">CH ${C.no}</div>
      <span class="kicker">${C.format}</span>
      <h2 class="neon lg">${C.icon} ${C.name}</h2>
      <p class="lead">${C.desc}</p>
      <span class="rule">${C.rule}</span>
      <button type="button" class="btn primary big" data-act="ch-start">▶ 방송 시작</button>
    </section>`;
  }

  /* ================= 화면: 퀴즈 ================= */
  function ringHTML(C) {
    const frac = C.timer ? S.tLeft / C.timer : 1;
    return `<div class="ring${S.tLeft <= 5 ? ' hot' : ''}" id="ring" aria-label="남은 시간"><svg viewBox="0 0 44 44"><circle class="trk" cx="22" cy="22" r="19"/><circle class="bar" id="ringBar" cx="22" cy="22" r="19" stroke-dasharray="119.4" stroke-dashoffset="${(119.4 * (1 - frac)).toFixed(1)}"/></svg><b id="ringNum">${Math.ceil(S.tLeft)}</b></div>`;
  }
  function viewQuiz() {
    const C = curCh(), i = S.q, Q = C.qs[i], st = qState(C.key, i), ord = order(C.key, i, Q.opts.length);
    let h = `<div class="osd">CH ${C.no}</div><div class="qhead"><span class="chip">${C.icon} ${C.name}</span><span class="chip">문제 <b>${i + 1}</b> / ${C.qs.length}</span>${S.combo >= 2 ? `<span class="chip combo">🔥 ${S.combo}연속</span>` : ''}${C.timer && !st.done ? ringHTML(C) : ''}</div>`;
    if (Q.emo) h += `<div class="emo" aria-hidden="true">${Q.emo}</div>`;
    if (Q.chain) h += `<div class="chain">${Q.chain.map((n) => n ? `<span class="node">${n}</span>` : `<span class="node blank${st.done ? ' fill' : ''}">${st.done ? Q.opts[Q.a] : '?'}</span>`).join('<span class="arr" aria-hidden="true">▶</span>')}</div>`;
    h += `<p class="qtext">${Q.q}</p><div class="opts">${ord.map((oi, pos) => {
      let cls = '';
      if (st.done) cls = oi === Q.a ? ' ok' : oi === st.pick ? ' no' : ' dim';
      return `<button type="button" class="opt${cls}" data-act="q-pick" data-i="${oi}"${st.done ? ' disabled' : ''}><span class="lt">${LETTERS[pos]}</span><span>${Q.opts[oi]}</span></button>`;
    }).join('')}</div>`;
    if (st.done) {
      const ok = st.pick === Q.a;
      h += `<div class="fb${ok ? '' : ' no'}" aria-live="polite"><b>${ok ? `정답! 시청률 +${C.pts}%` : st.timeout ? '⏰ 시간 초과!' : '아쉬워요!'}</b><span>${ok ? '' : `정답은 ‘${Q.opts[Q.a]}’예요. `}${Q.ex}</span></div>`;
      if (Q.art) h += `<figure class="art">${ART[Q.art]()}<figcaption>✨ 리폼 완료: ${Q.cap}</figcaption></figure>`;
      h += `<div class="nextbar"><button type="button" class="btn primary" id="nextBtn" data-act="q-next">${i < C.qs.length - 1 ? '다음 문제' : '방송 마치기'}</button></div>`;
    }
    return `<section style="position:relative">${h}</section>`;
  }

  /* ================= 화면: 스피드 분류 ================= */
  function viewRush() {
    const C = curCh(), R = S.rush, RD = C.rounds[R.round];
    let h = `<div class="osd">CH ${C.no}</div><div class="qhead"><span class="chip">${C.icon} ${C.name}</span><span class="chip">라운드 <b>${R.round + 1}</b> / ${C.rounds.length}</span>${S.combo >= 2 ? `<span class="chip combo">🔥 ${S.combo}연속</span>` : ''}</div>`;
    if (R.phase === 'intro') {
      h += `<h2 class="neon md ye">${RD.title}</h2><p class="lead" style="margin-top:.6rem">카드 ${RD.take}장, 제한 시간 ${RD.time}초! 아래 유형을 먼저 살펴보세요.</p>
        <div class="cats">${RD.cats.map((c, i) => `<span><b>${c}</b>${RD.desc[i]}</span>`).join('')}</div>
        <button type="button" class="btn primary big" data-act="rush-start">⚡ START</button>`;
    } else if (R.phase === 'count') {
      h += `<div class="countdown" aria-live="assertive">${R.count > 0 ? R.count : 'GO!'}</div>`;
    } else if (R.phase === 'play') {
      const card = R.cards[R.i], fl = R.flash;
      h += `<div class="tbar" aria-hidden="true"><i id="rushBar" style="width:${(R.left / RD.time) * 100}%"></i></div>
        <div class="row" style="margin-bottom:.6rem"><span class="chip">카드 <b>${R.i + 1}</b> / ${R.cards.length}</span><span class="chip">맞힘 <b>${R.res.filter((x) => x.ok).length}</b></span><span class="chip">남은 시간 <b id="rushLeft">${Math.ceil(R.left)}</b>초</span></div>
        <div class="rcard${fl ? (fl.ok ? ' ok' : ' no') : ''}"><span class="e" aria-hidden="true">${card.e}</span><span class="t">${card.t}</span>${fl ? `<span class="verdict">${fl.ok ? '⭕ 정답!' : `❌ 정답: ${RD.cats[card.a]}`}</span>` : ''}</div>
        <div class="bins">${RD.cats.map((c, ci) => { let cls = ''; if (fl) { if (ci === card.a) cls = ' ans'; else if (ci === fl.pick) cls = ' pick-no'; } return `<button type="button" class="bin${cls}" data-act="rush-pick" data-i="${ci}"${fl ? ' disabled' : ''}>${c}</button>`; }).join('')}</div>`;
    } else {
      const okN = R.res.filter((x) => x.ok).length;
      h += `<h2 class="neon md ye">${okN === R.cards.length ? '퍼펙트!' : '타임 오버!'} ${okN} / ${R.cards.length}</h2>
        <p class="lead" style="margin-top:.5rem">시청률 +${okN}%. 카드별 정답을 확인해 보세요.</p>
        <ul class="rlist">${R.cards.map((cd, ci) => { const r = R.res.find((x) => x.ci === ci); const m = !r ? '<span class="m to">⏰</span>' : r.ok ? '<span class="m ok">⭕</span>' : '<span class="m no">❌</span>'; return `<li>${m}<span>${cd.e} ${cd.t}</span><span class="a">${RD.cats[cd.a]}</span></li>`; }).join('')}</ul>
        <div class="nextbar"><button type="button" class="btn primary" id="nextBtn" data-act="rush-next">${R.round < C.rounds.length - 1 ? '다음 라운드' : '방송 마치기'}</button></div>`;
    }
    return `<section style="position:relative">${h}</section>`;
  }

  /* ================= 화면: 숫자 맞히기 ================= */
  const numFmt = (v, step) => (step < 1 ? Number(v).toFixed(1) : String(Math.round(v)));
  function viewSlider() {
    const C = curCh(), i = S.q, Q = C.qs[i], k = C.key + '.' + i;
    const st = S.sl[k] || (S.sl[k] = { val: Q.min + (Q.max - Q.min) / 2, revealed: false });
    const pct = (v) => ((v - Q.min) / (Q.max - Q.min)) * 100;
    let h = `<div class="osd">CH ${C.no}</div><div class="qhead"><span class="chip">${C.icon} ${C.name}</span><span class="chip">문제 <b>${i + 1}</b> / ${C.qs.length}</span></div>
      <p class="qtext">${Q.q}</p>
      <div class="slbox">
        <div class="slval"><b id="slVal">${numFmt(st.val, Q.step)}</b><span>${Q.unit}</span></div>
        <input type="range" class="range" data-input="slider" min="${Q.min}" max="${Q.max}" step="${Q.step}" value="${st.val}"${st.revealed ? ' disabled' : ''} aria-label="예측 값">
        <div class="slscale"><span>${Q.min}${Q.unit}</span><span>${Q.max}${Q.unit}</span></div>
        ${st.revealed ? `<div class="marks" aria-hidden="true"><span class="ln"></span><span class="mk me" style="left:${pct(st.val)}%">내 예측<i></i></span><span class="mk an" style="left:${pct(Q.ans)}%">정답<i></i></span></div>` : ''}
      </div>`;
    if (!st.revealed) {
      h += `<div class="nextbar"><button type="button" class="btn cy big" data-act="sl-reveal">🎯 정답 공개!</button></div>`;
    } else {
      const diff = Math.abs(st.val - Q.ans), p = S.pts[k] || 0;
      h += `<div class="reveal" aria-live="polite"><span class="ansbig">정답 ${numFmt(Q.ans, Q.step)}${Q.unit}</span>
        <span class="ptsline">내 예측 ${numFmt(st.val, Q.step)}${Q.unit} (차이 ${numFmt(diff, Q.step)}) · 시청률 +${p}%</span>
        <span>${Q.reveal}</span><span class="src">출처: 2020년 노인실태조사</span></div>
        <div class="nextbar"><button type="button" class="btn primary" id="nextBtn" data-act="sl-next">${i < C.qs.length - 1 ? '다음 문제' : '방송 마치기'}</button></div>`;
    }
    return `<section style="position:relative">${h}</section>`;
  }

  /* ================= 화면: 방송 종료 ================= */
  function viewRecap() {
    const C = curCh();
    return `<section class="recap">
      <span class="onair"><i></i>방송 종료</span>

  /* ================= 화면: 피날레 ================= */
  function viewFinale() {
    const F = S.fin;
    if (F.phase === 'intro') {
      return `<section style="display:grid;gap:1.1rem">
        <div><span class="onair"><i></i>LIVE</span></div>
        <h2 class="neon lg">피날레 생방송: 할아버지의 첫 외출을 기획하라</h2>
        <div class="card profile">
          <div class="pic">${ART.portrait()}</div>
          <dl>
            <dt>이름</dt><dd>최OO 할아버지, 72세 (가상 인물)</dd>
            <dt>과거</dt><dd>35년 동안 목수로 일하다 정년퇴직</dd>
            <dt>지금</dt><dd>하루 5시간 넘게 TV 시청, “뭘 해야 할지 모르겠어.”</dd>
            <dt>건강</dt><dd>무릎이 아파 오래 걷기는 힘들어요</dd>
            <dt>마음</dt><dd>예전 동료들과 어울리던 때가 그리워요</dd>
            <dt>동네</dt><dd>걸어갈 만한 곳에 노인복지관, 경로당, 노인교실이 있어요</dd>
          </dl>
        </div>
        <p class="lead">정답이 하나인 문제는 아니에요. 할아버지에게 가장 잘 맞는 선택일수록 시청률이 더 올라요.</p>
        <div class="nextbar"><button type="button" class="btn primary big" data-act="fin-start">🔴 생방송 시작</button></div>
      </section>`;
    }
    const i = F.q, Q = FIN.qs[i], pick = F.picks[i], done = pick != null;
    const best = Math.max(...Q.opts.map((o) => o.p));
    const ord = order('fin', i, Q.opts.length);
    let h = `<div class="qhead"><span class="onair"><i></i>LIVE</span><span class="chip">기획 <b>${i + 1}</b> / ${FIN.qs.length}</span></div>
      <p class="qtext">${Q.q}</p><div class="opts">${ord.map((oi, pos) => {
        const o = Q.opts[oi];
        let cls = '';
        if (done) cls = o.p === best ? ' ok' : oi === pick ? ' no' : ' dim';
        return `<button type="button" class="opt${cls}" data-act="fin-pick" data-i="${oi}"${done ? ' disabled' : ''}><span class="lt">${LETTERS[pos]}</span><span>${o.t}${done ? `<span class="pts">+${o.p}%</span><span class="nt">${o.n}</span>` : ''}</span></button>`;
      }).join('')}</div>`;
    if (done) {
      const p = Q.opts[pick].p;
      h += `<div class="fb${p === best ? '' : ' no'}"><b>${p === best ? `최고의 선택! 시청률 +${p}%` : `시청률 +${p}%`}</b><span>${p === best ? '할아버지에게 꼭 맞는 기획이에요.' : '초록색 선택지가 할아버지에게 가장 잘 맞아요.'}</span></div>
        <div class="nextbar"><button type="button" class="btn primary" id="nextBtn" data-act="fin-next">${i < FIN.qs.length - 1 ? '다음 기획' : '📺 방송 마무리'}</button></div>`;
    }
    return `<section style="position:relative">${h}</section>`;
  }
  function viewEnding() {
    return `<section class="ending">
      <span class="onair"><i></i>THE END</span>
      <h2 class="neon lg ye">할아버지가 TV를 끄고 집을 나섰어요!</h2>
      <div class="scene">${ART.ending(FIN.place)}</div>
      <p class="lead">${FIN.ending}</p>
      <button type="button" class="btn ye big" data-act="to-result">🏆 최종 시청률 보기</button>
    </section>`;
  }

  /* ================= 화면: 결과 ================= */
  function viewResult() {
    const t = total(), nm = S.name.trim();
    const title = t >= 90 ? '국민 MC급 작업치료사' : t >= 75 ? '시청률 보증수표 작업치료사' : t >= 60 ? '떠오르는 신인 작업치료사' : '재방송으로 다시 봐요';
    const rows = CH.map((c) => ({ n: `CH ${c.no} ${c.name}`, p: chPts(c.key), m: c.max })).concat([{ n: 'LIVE 피날레', p: chPts('fin'), m: FIN_MAX }]);
    const take = [
      ['📜', '여가의 의미', '여가는 의무가 아닌, 내적 동기로 하는 활동이에요. 탐색하고 참여하는 과정이 모두 중요해요.'],
      ['🚨', '노년기 여가의 문제', '평균수명은 늘고 역할은 사라져, 노인은 ‘역할 없는 역할’ 속에 강제로 주어진 여가를 보내기 쉬워요.'],
      ['⚡', '여가 유형', '목적(긴장해소~감각쾌락)과 관계 범위(단독충실형~사회참여형)로 나눌 수 있어요.'],
      ['📊', '참여 실태', '96%가 TV·라디오를 하루 4.2시간 이용해요. ‘무엇을 해야 할지 몰라서’ 못 하는 노인도 많아요.'],
      ['🦸', '여가 평가', '시간, 활동, 경험의 세 측면에서 평가도구를 골라요.'],
      ['✨', '작업치료 중재', '시간 재조정, 환경·작업의 변형, 수단으로서의 여가로 다시 참여하게 도와요.'],
    ];
    return `<section class="result">
      <div class="rtop">
        <span class="onair"><i></i>FINAL RATING</span>
        <h2 class="neon md">${nm ? esc(nm) + ' 작업치료사의 ' : ''}최종 시청률</h2>
        <div class="megarate"><b id="countUp">0</b><span>%</span></div>
        <span class="badge">${title}</span>
        <div class="stats"><span class="chip">⏱️ 진행 시간 <b>${fmt(S.time)}</b></span><span class="chip">🔥 최대 콤보 <b>${S.maxCombo}</b></span></div>
      </div>
      <div class="card"><h3 class="kicker">채널별 시청률</h3><div class="bars">${rows.map((r) => `<div class="br"><span>${r.n}</span><b>${r.p} / ${r.m}</b><i><em data-w="${Math.round((r.p / r.m) * 100)}"></em></i></div>`).join('')}</div></div>
      <div class="card"><h3 class="kicker">오늘 방송 다시 보기</h3><ul class="take">${take.map((x) => `<li><span aria-hidden="true">${x[0]}</span><span><b>${x[1]}</b>${x[2]}</span></li>`).join('')}</ul></div>
      <p class="quote">“여가는 남는 시간이 아니라, 삶을 다시 채우는 시간이다.”</p>
      <div class="card mission">
        <h3 class="kicker">방송 후 미션: 우리 동네 여가 프로그램 제안</h3>
        <p class="hint">내가 사는 지역의 노인여가복지시설을 조사하고, 그 시설을 이용하는 노인을 위한 여가 프로그램을 제안해 보세요.</p>
        <label>지역<input id="mRegion" placeholder="예: 원주시 단구동"></label>
        <label>노인여가복지시설<span class="seg" role="group" aria-label="시설 종류">${['노인복지관', '경로당', '노인교실'].map((f) => `<button type="button" data-act="m-fac" data-k="${f}" aria-pressed="${S.mFac === f}">${f}</button>`).join('')}</span></label>
        <label>시설 주 이용자<textarea id="mUser" placeholder="예: 혼자 사는 70대 남성, 퇴직 후 여가를 찾지 못한 분들"></textarea></label>
        <label>여가(레저)활동 프로그램<textarea id="mProg" placeholder="예: 프로그램 이름, 활동 내용, 기대 효과"></textarea></label>
        <div class="row" style="margin-top:.9rem"><span class="hint">작성한 내용은 저장되지 않아요. 복사하거나 캡처해서 제출하세요.</span><button type="button" class="btn ghost" data-act="copy-mission">📋 내용 복사하기</button></div>
      </div>
      <div class="row"><span class="hint">최OO 할아버지는 수업용 가상 인물이에요.</span><button type="button" class="btn primary big" data-act="restart-ask">🔁 처음부터 다시 하기</button></div>
    </section>`;
  }

  /* ================= 렌더링 ================= */
  function renderAll(anim) { renderTop(); renderMain(anim); }
  function renderMain(anim, focusId) {
    const main = $('#main');
    const V = { start: viewStart, hub: viewHub, intro: viewIntro, play: () => (curCh().type === 'quiz' ? viewQuiz() : curCh().type === 'rush' ? viewRush() : viewSlider()), recap: viewRecap, finale: viewFinale, ending: viewEnding, result: viewResult };
    const y = window.scrollY;
    main.innerHTML = (V[S.screen] || viewStart)();
    if (anim) { main.classList.remove('enter'); void main.offsetWidth; main.classList.add('enter'); const tv = document.querySelector('.tv'); if (tv && tv.getBoundingClientRect().top < 0) tv.scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'smooth' }); }
    else window.scrollTo(0, y);
    const f = focusId && document.getElementById(focusId);
    if (f) { try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); } }
    if (S.screen === 'result' && anim) {
      countTo($('#countUp'), 0, total(), 1500);
      requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.bars em').forEach((e) => { e.style.width = e.dataset.w + '%'; })));
    }
  }
  function go(screen, opts) {
    S.screen = screen;
    if (opts && opts.fx === 'static') staticFx();
    renderAll(true);
    if (opts && opts.fx === 'crt-on') screenFx('crt-on');
  }

  /* ================= 진행 ================= */
  function startQ() {
    const C = curCh();
    if (C.type === 'quiz' && C.timer) { S.tLeft = C.timer; S.timerOn = true; } else S.timerOn = false;
  }
  function finishChannel() {
    const C = curCh();
    S.timerOn = false;
    S.done[C.key] = true;
    if (chPts(C.key) === C.max) { SFX.fanfare(); confetti(40); }
    go('recap', { fx: 'static' });
  }
  function quizTimeout() {
    const C = curCh(), st = qState(C.key, S.q);
    if (st.done) return;
    st.done = true; st.timeout = true;
    hit(false);
    renderMain(false, 'nextBtn');
  }
  function updateRing() {
    const C = curCh(), bar = $('#ringBar'), num = $('#ringNum'), ring = $('#ring');
    if (!bar || !C.timer) return;
    bar.setAttribute('stroke-dashoffset', (119.4 * (1 - S.tLeft / C.timer)).toFixed(1));
    num.textContent = String(Math.ceil(S.tLeft));
    ring.classList.toggle('hot', S.tLeft <= 5);
  }
  function endRound() {
    const C = curCh(), R = S.rush;
    if (R.phase !== 'play') return;
    R.phase = 'done'; S.timerOn = false; R.flash = null;
    const okN = R.res.filter((x) => x.ok).length;
    award(`${C.key}.r${R.round}`, okN);
    if (okN === R.cards.length) { SFX.fanfare(); confetti(40); }
    renderMain(true);
  }
  let last = performance.now();
  function tick() {
    const now = performance.now(), dt = Math.min(1, (now - last) / 1000);
    last = now;
    if (['hub', 'intro', 'play', 'recap', 'finale'].includes(S.screen)) { S.time += dt; const c = $('#clock'); if (c) c.textContent = fmt(S.time); }
    if (!S.timerOn || S.screen !== 'play') return;
    const C = curCh();
    if (C.type === 'quiz') {
      const prev = Math.ceil(S.tLeft);
      S.tLeft = Math.max(0, S.tLeft - dt);
      const cur = Math.ceil(S.tLeft);
      updateRing();
      if (cur < prev && cur <= 5 && cur > 0) SFX.tick();
      if (S.tLeft <= 0) { S.timerOn = false; quizTimeout(); }
    } else if (C.type === 'rush' && S.rush.phase === 'play') {
      S.rush.left = Math.max(0, S.rush.left - dt);
      const bar = $('#rushBar'), lf = $('#rushLeft');
      if (bar) bar.style.width = (S.rush.left / C.rounds[S.rush.round].time) * 100 + '%';
      if (lf) lf.textContent = String(Math.ceil(S.rush.left));
      if (S.rush.left <= 0) { S.timerOn = false; endRound(); }
    }
  }

  /* ================= 모달 ================= */
  function openModal(html) {
    closeModal();
    const back = document.createElement('div'); back.className = 'modal-back'; back.id = 'modalBack';
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
    back.addEventListener('click', (e) => { if (e.target === back) closeModal(); });
    document.body.appendChild(back);
    const f = back.querySelector('[data-autofocus]') || back.querySelector('button'); if (f) f.focus();
  }
  function closeModal() { const m = $('#modalBack'); if (m) m.remove(); }

  /* ================= 동작 ================= */
  const A = {
    'power-on'() { SFX.power(); go('hub', { fx: 'crt-on' }); },
    sound() { S.sound = !S.sound; renderTop(); if (S.sound) SFX.ok(); },
    full() {
      if (!document.fullscreenElement) { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => toast('이 화면에서는 전체 화면을 열 수 없어요.')); }
      else if (document.exitFullscreen) document.exitFullscreen();
    },
    'restart-ask'() {
      openModal(`<h2>처음부터 다시 볼까요?</h2><p>시청률과 진행 상황이 모두 초기화돼요.</p><div class="row"><button type="button" class="btn ghost" data-act="modal-close" data-autofocus>취소</button><button type="button" class="btn primary" data-act="restart-confirm">다시 시작</button></div>`);
    },
    'restart-confirm'() { S.timerOn = false; S = freshState({ name: S.name, sound: S.sound }); closeModal(); go('start', { fx: 'static' }); },
    'modal-close'() { closeModal(); },
    'to-hub'() { go('hub', { fx: 'static' }); },
    'to-result'() { if (!S.fin.done) return; go('result', { fx: 'static' }); SFX.fanfare(); confetti(60); },
    'ch-open'(el) {
      const i = Number(el.dataset.i);
      if (!(i === 0 || S.done[CH[i - 1].key])) return;
      S.idx = i; S.q = 0;
      if (CH[i].type === 'rush') S.rush = { round: 0, phase: 'intro', i: 0, cards: [], res: [], left: 0, flash: null, count: 3 };
      go('intro', { fx: 'static' });
    },
    'ch-start'() { S.q = 0; startQ(); go('play', { fx: 'static' }); },

    /* 퀴즈 */
    'q-pick'(el) {
      const C = curCh(), st = qState(C.key, S.q);
      if (st.done) return;
      const oi = Number(el.dataset.i), Q = C.qs[S.q];
      st.pick = oi; st.done = true; S.timerOn = false;
      const ok = oi === Q.a;
      if (ok) award(C.key + '.' + S.q, C.pts);
      hit(ok);
      if (ok && Q.art) confetti(18);
      renderMain(false, 'nextBtn');
    },
    'q-next'() {
      const C = curCh();
      if (S.q < C.qs.length - 1) { S.q += 1; startQ(); renderMain(true); }
      else finishChannel();
    },

    /* 스피드 분류 */
    'rush-start'() {
      const C = curCh(), R = S.rush, RD = C.rounds[R.round];
      R.cards = shuffle(RD.cards).slice(0, RD.take); R.res = []; R.i = 0; R.flash = null; R.count = 3; R.phase = 'count';
      renderMain(false);
      const stepDown = () => {
        if (S.screen !== 'play' || R.phase !== 'count') return;
        R.count -= 1; SFX.tick();
        if (R.count >= 0) { renderMain(false); setTimeout(stepDown, R.count === 0 ? 450 : 650); }
        else { R.phase = 'play'; R.left = RD.time; S.timerOn = true; renderMain(false); }
      };
      SFX.tick();
      setTimeout(stepDown, 650);
    },
    'rush-pick'(el) {
      const C = curCh(), R = S.rush;
      if (R.phase !== 'play' || R.flash) return;
      const card = R.cards[R.i], pick = Number(el.dataset.i), ok = pick === card.a;
      R.res.push({ ci: R.i, pick, ok });
      R.flash = { ok, pick };
      hit(ok);
      renderMain(false);
      setTimeout(() => {
        if (R.phase !== 'play') return;
        R.flash = null; R.i += 1;
        if (R.i >= R.cards.length) endRound(); else renderMain(false);
      }, ok ? 320 : 700);
    },
    'rush-next'() {
      const C = curCh(), R = S.rush;
      if (R.round < C.rounds.length - 1) { R.round += 1; R.phase = 'intro'; R.res = []; R.cards = []; renderMain(true); }
      else finishChannel();
    },

    /* 숫자 맞히기 */
    'sl-reveal'() {
      const C = curCh(), Q = C.qs[S.q], k = C.key + '.' + S.q, st = S.sl[k];
      if (!st || st.revealed) return;
      st.revealed = true;
      const diff = Math.abs(st.val - Q.ans);
      const p = diff <= Q.tol[0] + 1e-9 ? 4 : diff <= Q.tol[1] + 1e-9 ? 3 : diff <= Q.tol[2] + 1e-9 ? 2 : 1;
      award(k, p);
      hit(p >= 3);
      if (p === 4) { confetti(30); toast('🎯 거의 정확해요!', true); }
      renderMain(false, 'nextBtn');
    },
    'sl-next'() {
      const C = curCh();
      if (S.q < C.qs.length - 1) { S.q += 1; renderMain(true); } else finishChannel();
    },

    /* 피날레 */
    'fin-open'() { if (!CH.every((c) => S.done[c.key])) return; if (S.fin.done) { go('ending', { fx: 'static' }); return; } S.fin.phase = 'intro'; go('finale', { fx: 'static' }); },
    'fin-start'() { S.fin.phase = 'q'; S.fin.q = 0; renderMain(true); },
    'fin-pick'(el) {
      const F = S.fin, Q = FIN.qs[F.q];
      if (F.picks[F.q] != null) return;
      const oi = Number(el.dataset.i), p = Q.opts[oi].p, best = Math.max(...Q.opts.map((o) => o.p));
      F.picks[F.q] = oi;
      award('fin.' + F.q, p);
      hit(p === best);
      renderMain(false, 'nextBtn');
    },
    'fin-next'() {
      const F = S.fin;
      if (F.q < FIN.qs.length - 1) { F.q += 1; renderMain(true); return; }
      F.done = true;
      screenFx('crt-off'); SFX.power();
      setTimeout(() => { go('ending', { fx: 'crt-on' }); SFX.fanfare(); confetti(50); }, reduceMotion ? 0 : 820);
    },

    'm-fac'(el) { S.mFac = el.dataset.k; el.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === el))); },
    'copy-mission'() {
      const v = (id) => ($('#' + id) || {}).value || '';
      const txt = `[방송 후 미션] ${S.name.trim()}\n지역: ${v('mRegion')}\n노인여가복지시설: ${S.mFac || ''}\n시설 주 이용자: ${v('mUser')}\n여가(레저)활동 프로그램: ${v('mProg')}`;
      const fallback = () => {
        const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; } ta.remove();
        toast(ok ? '복사했어요. 원하는 곳에 붙여 넣으세요.' : '복사가 막혀 있어요. 화면을 캡처해서 제출하세요.');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast('복사했어요. 원하는 곳에 붙여 넣으세요.')).catch(fallback); else fallback();
    },
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = A[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (!t || !t.dataset) return;
    if (t.dataset.input === 'name') S.name = t.value.slice(0, 16);
    if (t.dataset.input === 'slider' && S.screen === 'play') {
      const C = curCh(), Q = C.qs[S.q], st = S.sl[C.key + '.' + S.q];
      if (st && !st.revealed) { st.val = Number(t.value); const v = $('#slVal'); if (v) v.textContent = numFmt(st.val, Q.step); }
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('#modalBack')) { closeModal(); return; }
    const tag = (e.target && e.target.tagName ? e.target.tagName : '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (S.screen === 'play' && /^[1-5]$/.test(e.key)) {
      const C = curCh();
      if (C.type === 'rush' && S.rush.phase === 'play') { const b = document.querySelectorAll('.bin')[Number(e.key) - 1]; if (b) { b.click(); e.preventDefault(); } }
      else if (C.type === 'quiz') { const b = document.querySelectorAll('.opt')[Number(e.key) - 1]; if (b && !b.disabled) { b.click(); e.preventDefault(); } }
    }
  });

  renderAll(true);
  setInterval(tick, 100);
})();
</script>
</body>
</html>
